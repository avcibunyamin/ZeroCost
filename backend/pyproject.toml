[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerocost-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5", "httpx==0.28.1", "filelock==3.19.1", "anthropic==0.84.0", "google-genai==1.47.0", "langgraph==1.2.11", "langgraph-checkpoint-sqlite==3.1.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
